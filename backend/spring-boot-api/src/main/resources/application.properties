spring.application.name=SPRING_BE
server.port=8082

# K?t n?i MariaDB Local
spring.datasource.url=jdbc:mariadb://localhost:3306/zalo_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# C?u h?nh Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JWT Configuration
app.jwt.secret-key=zalo-clone-secret-key-very-long-string-for-jwt-signing-operations-please-change-in-production
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

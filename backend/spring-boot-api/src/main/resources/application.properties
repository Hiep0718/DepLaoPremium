spring.application.name=SPRING_BE
server.port=8082

# K?t n?i MariaDB Local
spring.datasource.url=jdbc:mariadb://localhost:3307/zalo_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# C?u h?nh Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# JWT Configuration
app.jwt.secret-key=${JWT_SECRET:zalo-clone-secret-key-very-long-string-for-jwt-signing-operations-please-change-in-production}
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=604800000

# AWS S3 Configuration



# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
